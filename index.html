<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="" data-i18n-content="meta.description">
  <title data-i18n="meta.title"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-shell">
    <div class="ambient ambient-orbit ambient-a"></div>
    <div class="ambient ambient-orbit ambient-b"></div>
    <div class="ambient ambient-orbit ambient-c"></div>
    <div class="ambient ambient-beam ambient-d"></div>

    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="#hero" data-i18n-aria-label="accessibility.home">
          <span class="brand-mark">MICRO CTA</span>
          <span class="brand-sub">WE ARE ALL TRADERS</span>
        </a>

        <div class="topbar-actions">
          <nav class="nav" data-i18n-aria-label="accessibility.primaryNav">
            <a href="#hero" data-i18n="nav.dashboard"></a>
            <a href="#strategy" data-i18n="nav.strategy"></a>
            <a href="#statistics" data-i18n="nav.statistics"></a>
            <a href="#research" data-i18n="nav.research"></a>
          </nav>

          <div class="lang-switcher" data-i18n-aria-label="language.switcherAria">
            <button class="lang-button" type="button" data-lang="pl" aria-pressed="false">PL</button>
            <span class="lang-divider">/</span>
            <button class="lang-button" type="button" data-lang="en" aria-pressed="false">ENG</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero" id="hero">
        <div class="container hero-grid">
          <div class="hero-copy reveal">
            <span class="eyebrow" data-i18n="hero.eyebrow"></span>

            <h1>
              <span data-i18n="hero.titleLine1"></span>
              <span class="accent-text" data-i18n="hero.titleLine2"></span>
              <span data-i18n="hero.titleLine3"></span>
            </h1>

            <p class="hero-lead" data-i18n="hero.lead"></p>

            <p class="hero-quote">
              <span data-i18n="hero.quoteLine1"></span><br>
              <span data-i18n="hero.quoteLine2"></span>
            </p>

            <div class="hero-actions">
              <a class="button button-primary" href="#statistics" data-i18n="hero.primaryCta"></a>
              <a class="button button-secondary" href="#research" data-i18n="hero.secondaryCta"></a>
            </div>

            <div class="hero-ribbon">
              <div class="ribbon-card">
                <span data-i18n="hero.ribbonMandateLabel"></span>
                <strong data-i18n="hero.ribbonMandateValue"></strong>
              </div>
              <div class="ribbon-card">
                <span data-i18n="hero.ribbonEngineLabel"></span>
                <strong data-i18n="hero.ribbonEngineValue"></strong>
              </div>
            </div>
          </div>

          <div class="hero-stage reveal">
            <div class="terminal-frame">
              <div class="terminal-topline">
                <span class="status-dot"></span>
                <span class="status-dot"></span>
                <span class="status-dot"></span>
              </div>

              <div class="terminal-copy">
                <span class="terminal-label" data-i18n="hero.terminalLabel"></span>
                <strong data-i18n="hero.terminalTitle"></strong>
                <p class="terminal-meta" id="terminalMeta"></p>
              </div>
            </div>

            <div class="hero-kpis" id="heroMetrics"></div>
          </div>
        </div>

        <div class="container">
          <div class="overview-strip reveal" id="dashboardStats"></div>
        </div>
      </section>

      <section class="section chart-section" id="statistics">
        <div class="container">
          <div class="section-heading reveal">
            <div>
              <span class="eyebrow" data-i18n="sections.performanceArchive.eyebrow"></span>
              <h2 data-i18n="sections.performanceArchive.title"></h2>
            </div>
            <p data-i18n="sections.performanceArchive.body"></p>
          </div>

          <div class="chart-panel reveal">
            <div class="chart-panel-header">
              <div>
                <span class="panel-label" data-i18n="sections.equityCurve.panelLabel"></span>
                <h3 data-i18n="sections.equityCurve.title"></h3>
              </div>
              <div class="chart-stat-row" id="chartSummary"></div>
            </div>

            <div class="chart-wrap">
              <canvas id="equityChart" data-i18n-aria-label="accessibility.equityChart"></canvas>
              <div class="chart-empty-state" id="chartEmptyState" hidden data-i18n="empty.chart"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="section stats-section">
        <div class="container">
          <div class="section-heading reveal">
            <div>
              <span class="eyebrow" data-i18n="sections.advancedStats.eyebrow"></span>
              <h2 data-i18n="sections.advancedStats.title"></h2>
            </div>
            <p data-i18n="sections.advancedStats.body"></p>
          </div>

          <div class="stats-grid reveal" id="advancedMetrics"></div>
        </div>
      </section>

      <section class="section strategy-section" id="strategy">
        <div class="container strategy-grid">
          <div class="strategy-copy reveal">
            <span class="eyebrow" data-i18n="sections.strategy.eyebrow"></span>
            <h2 data-i18n="sections.strategy.title"></h2>
            <p data-i18n="sections.strategy.paragraph1"></p>
            <p data-i18n="sections.strategy.paragraph2"></p>
            <p data-i18n="sections.strategy.paragraph3"></p>
          </div>

          <div class="insight-column reveal">
            <article class="insight-card">
              <span class="insight-index">A1</span>
              <h3 data-i18n="sections.strategyInsight.card1Title"></h3>
              <p data-i18n="sections.strategyInsight.card1Body"></p>
            </article>
            <article class="insight-card raised">
              <span class="insight-index">B2</span>
              <h3 data-i18n="sections.strategyInsight.card2Title"></h3>
              <p data-i18n="sections.strategyInsight.card2Body"></p>
            </article>
            <article class="insight-card">
              <span class="insight-index">C3</span>
              <h3 data-i18n="sections.strategyInsight.card3Title"></h3>
              <p data-i18n="sections.strategyInsight.card3Body"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="section returns-section" id="returns">
        <div class="container">
          <div class="section-heading reveal">
            <div>
              <span class="eyebrow" data-i18n="sections.monthlyReturns.eyebrow"></span>
              <h2 data-i18n="sections.monthlyReturns.title"></h2>
            </div>
            <p data-i18n="sections.monthlyReturns.body"></p>
          </div>

          <div class="monthly-summary-grid reveal" id="monthlySummary"></div>

          <div class="table-card reveal">
            <div class="table-card-header">
              <span class="panel-label" data-i18n="sections.monthlyReturns.panelLabel"></span>
              <h3 data-i18n="sections.monthlyReturns.tableTitle"></h3>
            </div>
            <div class="table-wrap">
              <table class="data-table returns-table">
                <thead>
                  <tr>
                    <th data-i18n="tables.monthly.headers.month"></th>
                    <th data-i18n="tables.monthly.headers.return"></th>
                    <th data-i18n="tables.monthly.headers.cumulative"></th>
                    <th data-i18n="tables.monthly.headers.assessment"></th>
                  </tr>
                </thead>
                <tbody id="monthlyReturnsTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <section class="section trade-section" id="trades">
        <div class="container">
          <div class="section-heading reveal">
            <div>
              <span class="eyebrow" data-i18n="sections.trades.eyebrow"></span>
              <h2 data-i18n="sections.trades.title"></h2>
            </div>
            <p data-i18n="sections.trades.body"></p>
          </div>

          <div class="table-card reveal">
            <div class="table-card-header">
              <span class="panel-label" data-i18n="sections.trades.panelLabel"></span>
              <h3 data-i18n="sections.trades.tableTitle"></h3>
            </div>
            <div class="table-wrap">
              <table class="data-table trades-table">
                <thead>
                  <tr>
                    <th data-i18n="tables.trades.headers.date"></th>
                    <th data-i18n="tables.trades.headers.instrument"></th>
                    <th data-i18n="tables.trades.headers.direction"></th>
                    <th data-i18n="tables.trades.headers.result"></th>
                    <th data-i18n="tables.trades.headers.rr"></th>
                    <th data-i18n="tables.trades.headers.status"></th>
                    <th data-i18n="tables.trades.headers.notes"></th>
                  </tr>
                </thead>
                <tbody id="recentTradesTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <section class="section research-section" id="research">
        <div class="container">
          <div class="section-heading reveal">
            <div>
              <span class="eyebrow" data-i18n="sections.research.eyebrow"></span>
              <h2 data-i18n="sections.research.title"></h2>
            </div>
            <p data-i18n="sections.research.body"></p>
          </div>

          <div class="research-grid">
            <article class="research-card reveal">
              <span class="research-tag">01</span>
              <h3 data-i18n="sections.research.card1Title"></h3>
              <p data-i18n="sections.research.card1Body"></p>
            </article>
            <article class="research-card reveal">
              <span class="research-tag">02</span>
              <h3 data-i18n="sections.research.card2Title"></h3>
              <p data-i18n="sections.research.card2Body"></p>
            </article>
            <article class="research-card reveal">
              <span class="research-tag">03</span>
              <h3 data-i18n="sections.research.card3Title"></h3>
              <p data-i18n="sections.research.card3Body"></p>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-brand-group">
          <span class="footer-brand">WE ARE ALL TRADERS</span>
          <span class="footer-copy">MICRO CTA</span>
        </div>
        <p id="footerMeta"></p>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
